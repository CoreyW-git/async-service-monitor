image:
  pullPolicy: IfNotPresent

dockerSocket:
  enabled: false

# To enable Docker container management from the admin portal, enable
# "Expose daemon on tcp://localhost:2375 without TLS" in Docker Desktop
# Settings > General, then uncomment the block below:
# env:
#   dockerHost: tcp://host.docker.internal:2375

securityContext:
  capabilities:
    add:
      - NET_RAW
      - NET_ADMIN

service:
  type: LoadBalancer

persistence:
  enabled: true
  bootstrapImage: busybox:1.36

config:
  content: |
    defaults:
      timeout_seconds: 10
      user_agent: async-service-monitor/0.1.0
      peer_timeout_seconds: 3
      peer_poll_interval_seconds: 15
      recovery_cooldown_seconds: 300
      bind_host: 0.0.0.0
      bind_port: 8000

    cluster:
      enabled: false
      node_id: monitor-k8s-1
      bind_port: 8001

    notifications:
      email:
        enabled: false
        provider: custom
        port: 587
        subject_prefix: "[async-service-monitor]"
        use_tls: true
        use_ssl: false

    telemetry:
      enabled: false
      timeseries_provider: local_postgresql
      timeseries_port: 5432
      timeseries_local_container_name: async-service-monitor-postgres
      object_provider: local_minio
      object_bucket: async-service-monitor
      object_console_port: 9001
      object_local_container_name: async-service-monitor-minio
      retention_hours: 2
      timeseries_use_ssl: false
      object_use_ssl: false
      auto_provision_timeseries_local: false
      auto_provision_object_local: false

    portal:
      enabled: true
      provider: basic
      realm: Service Health Portal
      users: []
      oci:
        enabled: false

    checks:
      - name: self-health
        type: http
        enabled: true
        interval_seconds: 60
        timeout_seconds: 10
        url: http://127.0.0.1:8000/healthz
        request_method: GET
        expected_statuses:
          - 200
        retry:
          attempts: 1
          delay_seconds: 0
          retry_on_statuses: []
          retry_on_timeout: true
          retry_on_connection_error: true

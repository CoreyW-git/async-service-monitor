services:
  app:
    build: .
    image: async-service-monitor:local
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      DISPLAY: ":99"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python", "/app/recorder_desktop.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  app-data:
